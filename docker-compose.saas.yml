# SaaS/Cloud override for docker-compose.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.saas.yml up -d
# Environment variables to set (example):
#   export DOMAIN=example.com
#   export HTTP_PORT=80
#   export HTTPS_PORT=443
#   export POSTGRES_PASSWORD=your-secure-password
#   export ACCESS_TOKEN_SECRET=$(openssl rand -hex 32)
#   export REFRESH_TOKEN_SECRET=$(openssl rand -hex 32)
#
# In SaaS deployment, only Caddy (80/443) and ingest (514) expose ports externally.
# Backend, frontend, worker, webhook-receiver, db, redis communicate via Docker network only.
# WARNING: Port 514 should be IP-restricted via cloud firewall.

services:
  caddy:
    environment:
      - DOMAIN=${DOMAIN}
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"

  ingest:
    ports:
      - "0.0.0.0:514:5514/udp"
      - "0.0.0.0:514:5514/tcp"

  db:
    # PORTS REMOVED: database accessible only via Docker network
    image: postgres:16-alpine
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_USER=logs
      - POSTGRES_DB=logs_manager

  worker:
    environment:
      - ENV=saas
    # PORTS REMOVED: worker is background-only

  webhook-receiver:
    # PORTS REMOVED: internal-only

  frontend:
    # PORTS REMOVED: served through Caddy

  backend:
    # PORTS REMOVED: internal API access only

  redis:
    # PORTS REMOVED: internal-only