name: Release (release-please)

on:
  push:
    branches: [dev]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GIT_PUSH_PAT }}
          config-file: release-please-config.json
          target-branch: dev

  retag-release-image:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Wait for the release commit's images (up to 30 min)
        env:
          SHA: ${{ needs.release-please.outputs.sha }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if ! [[ "${SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: release-please output 'sha' is not a full commit SHA: '${SHA}'" >&2
            exit 1
          fi
          OWNER="${REPO_OWNER,,}"
          ELAPSED=0
          while [ "${ELAPSED}" -lt 1800 ]; do
            ALL_FOUND=1
            for PKG in backend ingest frontend; do
              if ! docker buildx imagetools inspect "ghcr.io/${OWNER}/logs-manager-${PKG}:${SHA}" >/dev/null 2>&1; then
                ALL_FOUND=0
                break
              fi
            done
            if [ "${ALL_FOUND}" -eq 1 ]; then
              echo "All three images found for ${SHA}."
              exit 0
            fi
            echo "Waiting for images (${ELAPSED}s elapsed)"
            sleep 10
            ELAPSED=$((ELAPSED + 10))
          done
          echo "Timed out waiting for images for ${SHA}." >&2
          exit 1
      - name: Verify image revision and retag as vX.Y.Z (no rebuild)
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          SHA: ${{ needs.release-please.outputs.sha }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if ! [[ "${SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: release-please output 'sha' is not a full commit SHA: '${SHA}'" >&2
            exit 1
          fi
          if [ -z "${RELEASE_TAG}" ]; then
            echo "ERROR: release-please output 'tag_name' is empty" >&2
            exit 1
          fi
          OWNER="${REPO_OWNER,,}"
          for PKG in backend ingest frontend; do
            SRC="ghcr.io/${OWNER}/logs-manager-${PKG}:${SHA}"
            REVISION=$(docker buildx imagetools inspect "$SRC" --format '{{json .Image}}' \
              | python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          def label(image):
              config = image.get("config") or {}
              labels = config.get("Labels") or {}
              return labels.get("org.opencontainers.image.revision")

          if "config" in data:
              revision = label(data)
          elif "linux/amd64" in data:
              revision = label(data["linux/amd64"])
          else:
              revision = label(next(iter(data.values())))

          print(revision or "")
          ')
            if [ "$REVISION" != "$SHA" ]; then
              echo "ERROR: Image $SRC has OCI revision label '$REVISION', expected '$SHA'. Image may not be from the intended release commit." >&2
              exit 1
            fi
            DIGEST=$(docker buildx imagetools inspect "$SRC" --format '{{.Manifest.Digest}}')
            if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "ERROR: Could not resolve a valid manifest digest for $SRC (got '$DIGEST')." >&2
              exit 1
            fi
            DST="ghcr.io/${OWNER}/logs-manager-${PKG}:${RELEASE_TAG}"
            SRC_REPO="${SRC%:*}"
            echo "Retagging $SRC (digest: $DIGEST, revision: $REVISION) -> $DST"
            docker buildx imagetools create -t "$DST" "${SRC_REPO}@${DIGEST}"
            RELEASE_DIGEST=$(docker buildx imagetools inspect "$DST" --format '{{.Manifest.Digest}}')
            if [ "$RELEASE_DIGEST" != "$DIGEST" ]; then
              echo "ERROR: Release tag $DST resolves to '$RELEASE_DIGEST', expected '$DIGEST'." >&2
              exit 1
            fi
            echo "  verified ${DST} -> ${RELEASE_DIGEST}"
          done
          echo "All images retagged as ${RELEASE_TAG}."