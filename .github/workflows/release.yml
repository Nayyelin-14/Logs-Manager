name: Release (release-please)

on:
  push:
    branches: [dev]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GIT_PUSH_PAT }}
      - name: Run release-please
        uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GIT_PUSH_PAT }}
          config-file: release-please-config.json

  retag-release-image:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Wait for release commit's images in GHCR (up to ~15 min)
        id: wait
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          SHA: ${{ needs.release-please.outputs.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          PKG_BACKEND: logs-manager-backend
          PKG_INGEST: logs-manager-ingest
          PKG_FRONTEND: logs-manager-frontend
        run: |
          set -euo pipefail
          OWNER="${REPO_OWNER,,}"
          ELAPSED=0
          TIMEOUT=900
          while [ "${ELAPSED}" -lt "${TIMEOUT}" ]; do
            ALL_FOUND=1
            for PKG in "${PKG_BACKEND}" "${PKG_INGEST}" "${PKG_FRONTEND}"; do
              IMG_TAG="ghcr.io/${OWNER}/${PKG}:${SHA}"
              if ! docker manifest inspect "${IMG_TAG}" >/dev/null 2>&1; then
                ALL_FOUND=0
                break
              fi
            done
            if [ "${ALL_FOUND}" -eq 1 ]; then
              echo "All three images found for sha ${SHA}."
              echo "found=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Waiting for images... (${ELAPSED}s elapsed)"
            sleep 10
            ELAPSED=$((ELAPSED + 10))
          done
          echo "Timed out waiting for images for sha ${SHA}." >&2
          echo "found=false" >> $GITHUB_OUTPUT
          exit 1
      - name: Retag images as vX.Y.Z (imagetools create, no rebuild)
        if: steps.wait.outputs.found == 'true'
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          SHA: ${{ needs.release-please.outputs.sha }}
          REPO_OWNER: ${{ github.repository_owner }}
          PKG_BACKEND: logs-manager-backend
          PKG_INGEST: logs-manager-ingest
          PKG_FRONTEND: logs-manager-frontend
        run: |
          set -euo pipefail
          OWNER="${REPO_OWNER,,}"
          for PKG in "${PKG_BACKEND}" "${PKG_INGEST}" "${PKG_FRONTEND}"; do
            SRC="ghcr.io/${OWNER}/${PKG}:${SHA}"
            DST="ghcr.io/${OWNER}/${PKG}:${TAG}"
            echo "Retagging ${SRC} -> ${DST}"
            docker buildx imagetools create -t "${DST}" "${SRC}"
          done
          echo "All images retagged as ${TAG}."
