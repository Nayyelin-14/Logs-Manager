name: Deploy SaaS

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-saas
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease != true }}
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      SAAS_BACKEND_URL: ${{ vars.SAAS_BACKEND_URL || 'https://nayyelin-logs-api.onrender.com' }}
      SAAS_FRONTEND_URL: ${{ vars.SAAS_FRONTEND_URL }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

      - name: Resolve target commit
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          echo "TARGET_SHA=$SHA" >> "$GITHUB_ENV"
          echo "target=$SHA"

      - name: Check deploy configuration
        id: config
        run: |
          set -euo pipefail
          if [ -z "${RENDER_DEPLOY_HOOK_URL}" ] && [ -z "${VERCEL_TOKEN}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No deploy secrets configured; skipping deployment."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the target commit is still the branch head
        if: steps.config.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          HEAD_SHA=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/dev | cut -f1)
          echo "target=$TARGET_SHA head=$HEAD_SHA"
          if [ "$HEAD_SHA" != "$TARGET_SHA" ]; then
            echo "dev has moved past this release. Deploy the current dev head manually instead." >&2
            exit 1
          fi

      - name: Wait for CI on the target commit
        if: steps.config.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ env.TARGET_SHA }}
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            LINE=$(gh run list --workflow ci.yml --commit "$SHA" --limit 1 \
              --json status,conclusion \
              --jq '.[0] | "\(.status) \(.conclusion // "-")"' 2>/dev/null || true)
            STATUS=${LINE%% *}
            CONCLUSION=${LINE#* }
            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "CI for $SHA succeeded"
                exit 0
              fi
              echo "CI for $SHA concluded $CONCLUSION" >&2
              exit 1
            fi
            echo "waiting for CI ($i/90): ${LINE:-not found}"
            sleep 10
          done
          echo "CI did not complete for $SHA within 15 minutes" >&2
          exit 1

      - name: Deploy Render and Vercel in parallel
        if: steps.config.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          RENDER_PID=""
          VERCEL_PID=""
          if [ -n "${RENDER_DEPLOY_HOOK_URL}" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" >/tmp/render-trigger.log &
            RENDER_PID=$!
          fi
          if [ -n "${VERCEL_TOKEN}" ]; then
            (
              npm install --global vercel@latest
              vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
              vercel build --prod --token "$VERCEL_TOKEN"
              vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
            ) >/tmp/vercel-deploy.log 2>&1 &
            VERCEL_PID=$!
          fi
          FAIL=0
          if [ -n "$RENDER_PID" ]; then wait "$RENDER_PID" || FAIL=1; fi
          if [ -n "$VERCEL_PID" ]; then wait "$VERCEL_PID" || FAIL=1; fi
          if [ "$FAIL" -ne 0 ]; then
            echo "One or more deploy triggers failed." >&2
            [ -f /tmp/render-trigger.log ] && cat /tmp/render-trigger.log >&2 || true
            [ -f /tmp/vercel-deploy.log ] && tail -80 /tmp/vercel-deploy.log >&2 || true
            exit 1
          fi

      - name: Wait for Render to serve the target commit
        if: steps.config.outputs.enabled == 'true' && env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            SHA=$(curl -fsS --max-time 15 "$SAAS_BACKEND_URL/version" 2>/dev/null \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("git_sha",""))' 2>/dev/null || true)
            if [ "$SHA" = "$TARGET_SHA" ]; then
              echo "Render is serving $TARGET_SHA"
              exit 0
            fi
            echo "waiting for Render ($i/90): deployed=${SHA:-none} expected=$TARGET_SHA"
            sleep 10
          done
          echo "Render did not serve $TARGET_SHA within 15 minutes" >&2
          exit 1

      - name: Smoke test SaaS endpoints
        if: steps.config.outputs.enabled == 'true' && env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          set -euo pipefail
          EXPECTED_SHA="$TARGET_SHA" bash scripts/smoke_saas.sh "$SAAS_BACKEND_URL" "${SAAS_FRONTEND_URL:-}"
