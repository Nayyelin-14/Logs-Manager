name: CI

on:
  push:
    branches: [dev, 'hotfix/*']
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: logs
          POSTGRES_PASSWORD: postgres_pass
          POSTGRES_DB: logs_manager_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U logs -d logs_manager_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DB_PORT: "55432"
      TEST_REDIS_PORT: "56379"
      TEST_DATABASE_URL: postgresql+asyncpg://logs:postgres_pass@localhost:55432/logs_manager_test?sslmode=disable
      DATABASE_URL: postgresql+asyncpg://logs:postgres_pass@localhost:55432/logs_manager_test?sslmode=disable
      REDIS_URL: redis://localhost:56379
      ACCESS_TOKEN_SECRET: ci-test-access-secret-0123456789abcdef0123456789abcdef
      REFRESH_TOKEN_SECRET: ci-test-refresh-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: |
          cd backend
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Environment sync check
        run: python3 scripts/check_env_sync.py
      - name: SaaS deployment config check
        run: |
          cd backend
          . .venv/bin/activate
          cd ..
          python3 scripts/check_saas_config.py
      - name: File size check
        run: bash scripts/check_file_sizes.sh
      - name: Frontend typecheck
        run: cd frontend && npx tsc -b
      - name: Frontend lint
        run: cd frontend && npm run lint
      - name: Frontend build
        env:
          VITE_API_URL: /api
        run: cd frontend && npm run build
      - name: Backend tests
        run: |
          cd backend
          . .venv/bin/activate
          python -m pytest -q
      - name: Alembic upgrade head (fresh database)
        env:
          PGPASSWORD: postgres_pass
          DATABASE_URL: postgresql+asyncpg://logs:postgres_pass@localhost:55432/logs_manager_alembic?sslmode=disable
        run: |
          set -euo pipefail
          cd backend
          . .venv/bin/activate
          python3 - <<'PY'
          import asyncio
          import asyncpg

          async def main():
              conn = await asyncpg.connect(
                  host='localhost', port=55432,
                  user='logs', password='postgres_pass',
                  database='postgres'
              )
              await conn.execute('DROP DATABASE IF EXISTS logs_manager_alembic')
              await conn.execute('CREATE DATABASE logs_manager_alembic OWNER logs')
              await conn.close()

          asyncio.run(main())
          PY
          alembic upgrade head
      - name: Alembic single-head check
        run: |
          cd backend
          . .venv/bin/activate
          HEADS_COUNT=$(alembic heads | grep -c '(head)')
          if [ "$HEADS_COUNT" -ne 1 ]; then
            echo "Expected exactly 1 alembic head, found $HEADS_COUNT" >&2
            alembic heads
            exit 1
          fi
          echo "Single alembic head confirmed"

  pr-title-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            build
            ci
            docs
            refactor
            perf
            test
            style
            revert

  build-smoke-push:
    needs: [lint-and-test, pr-title-check]
    if: |
      always() && needs.lint-and-test.result == 'success' &&
      (needs.pr-title-check.result == 'success' || needs.pr-title-check.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute build version and tags
        id: version
        env:
          FULL_SHA: ${{ github.sha }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          SHORT_SHA="${FULL_SHA:0:7}"
          CT=$(git show -s --format=%ct "${FULL_SHA}")
          TAG_TS=$(date -u -d "@${CT}" +%Y%m%d-%H%M%S)
          CREATED=$(date -u -d "@${CT}" +%Y-%m-%dT%H:%M:%SZ)
          MANIFEST=$(jq -r '.["."] // empty' .release-please-manifest.json 2>/dev/null || true)
          if [ -z "${MANIFEST}" ]; then
            APP_VERSION="0.0.0-dev+${SHORT_SHA}"
          elif git log -1 --format=%s | grep -Eq '^chore(\(.+\))?: release '; then
            APP_VERSION="${MANIFEST}"
          else
            APP_VERSION="${MANIFEST}-dev+${SHORT_SHA}"
          fi
          {
            echo "full_sha=${FULL_SHA}"
            echo "short_sha=${SHORT_SHA}"
            echo "created_ts=${CREATED}"
            echo "app_version=${APP_VERSION}"
            echo "dev_tag=dev-${TAG_TS}-${SHORT_SHA}"
            echo "owner_lower=${REPO_OWNER,,}"
          } >> "$GITHUB_OUTPUT"
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: |
            ghcr.io/${{ steps.version.outputs.owner_lower }}/logs-manager-backend:${{ steps.version.outputs.dev_tag }}
            ghcr.io/${{ steps.version.outputs.owner_lower }}/logs-manager-backend:${{ steps.version.outputs.full_sha }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.app_version }}
            GIT_SHA=${{ steps.version.outputs.full_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.version.outputs.full_sha }}
            org.opencontainers.image.created=${{ steps.version.outputs.created_ts }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build ingest image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ingest/Dockerfile
          load: true
          tags: |
            ghcr.io/${{ steps.version.outputs.owner_lower }}/logs-manager-ingest:${{ steps.version.outputs.dev_tag }}
            ghcr.io/${{ steps.version.outputs.owner_lower }}/logs-manager-ingest:${{ steps.version.outputs.full_sha }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.app_version }}
            GIT_SHA=${{ steps.version.outputs.full_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.version.outputs.full_sha }}
            org.opencontainers.image.created=${{ steps.version.outputs.created_ts }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend (Caddy) image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          load: true
          tags: |
            ghcr.io/${{ steps.version.outputs.owner_lower }}/logs-manager-frontend:${{ steps.version.outputs.dev_tag }}
            ghcr.io/${{ steps.version.outputs.owner_lower }}/logs-manager-frontend:${{ steps.version.outputs.full_sha }}
          build-args: |
            VITE_API_URL=/api
            VITE_APP_VERSION=${{ steps.version.outputs.app_version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.version.outputs.full_sha }}
            org.opencontainers.image.created=${{ steps.version.outputs.created_ts }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        env:
          BACKEND_IMAGE: ghcr.io/${{ steps.version.outputs.owner_lower }}/logs-manager-backend:${{ steps.version.outputs.full_sha }}
          INGEST_IMAGE: ghcr.io/${{ steps.version.outputs.owner_lower }}/logs-manager-ingest:${{ steps.version.outputs.full_sha }}
          FRONTEND_IMAGE: ghcr.io/${{ steps.version.outputs.owner_lower }}/logs-manager-frontend:${{ steps.version.outputs.full_sha }}
          DOMAIN: localhost
          POSTGRES_PASSWORD: ci_postgres_pass_0123456789
          DATABASE_URL: postgresql+asyncpg://logs:ci_postgres_pass_0123456789@db:5432/logs_manager?sslmode=disable
          ACCESS_TOKEN_SECRET: ci-test-access-secret-0123456789abcdef0123456789abcdef
          REFRESH_TOKEN_SECRET: ci-test-refresh-secret-0123456789abcdef0123456789abcdef
          INGEST_API_KEY: ci-test-ingest-key-0123456789abcdef0123456789abcdef
          SEED_ADMIN_PASSWORD: ci-seed-admin-0123456789abcdef
          SEED_VIEWER_A_PASSWORD: ci-seed-viewer-a-0123456789abcdef
          SEED_VIEWER_B_PASSWORD: ci-seed-viewer-b-0123456789abcdef
          CORS_ORIGINS: '["http://localhost"]'
          ALLOWED_HOSTS: '["localhost","127.0.0.1","backend"]'
          HTTP_PORT: 18080
          HTTPS_PORT: 18443
        run: |
          set -euo pipefail
          DC=(docker compose -f docker-compose.vm.yml)
          RENDERED=$("${DC[@]}" config)
          for IMG in "${BACKEND_IMAGE}" "${INGEST_IMAGE}" "${FRONTEND_IMAGE}"; do
            echo "${RENDERED}" | grep -qF "${IMG}" || { echo "docker-compose.vm.yml does not use ${IMG}" >&2; exit 1; }
          done
          "${DC[@]}" up -d --wait db redis backend ingest caddy worker webhook-receiver
          for EP in healthz ready features version; do
            echo "Checking backend /${EP}..."
            "${DC[@]}" exec -T backend curl -sf "http://localhost:4500/${EP}" >/dev/null
          done
          CADDY_IP=$("${DC[@]}" ps -q caddy | xargs docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')
          echo "Caddy IP: ${CADDY_IP}"
          "${DC[@]}" exec -T backend python scripts/seed_demo_data.py >/dev/null
          echo "Checking Caddy -> SPA..."
          "${DC[@]}" exec -T backend curl -sk --resolve "localhost:443:${CADDY_IP}" https://localhost/ | grep -qi '<!doctype html'
          "${DC[@]}" exec -T backend curl -sk --resolve "localhost:443:${CADDY_IP}" https://localhost/logs | grep -qi '<!doctype html'
          echo "Checking Caddy -> backend health..."
          "${DC[@]}" exec -T backend curl -sk --resolve "localhost:443:${CADDY_IP}" https://localhost/healthz | grep -q '"status"'
          echo "Checking Caddy -> backend auth enforcement..."
          AUTH_CODE=$("${DC[@]}" exec -T backend curl -sk --resolve "localhost:443:${CADDY_IP}" -o /dev/null -w '%{http_code}' https://localhost/api/get-logs)
          [ "${AUTH_CODE}" = "401" ] || { echo "Expected 401 from /api/get-logs, got ${AUTH_CODE}" >&2; exit 1; }
          echo "Checking Caddy -> public ingest..."
          "${DC[@]}" exec -T backend curl -sk --resolve "localhost:443:${CADDY_IP}" -X POST https://localhost/api/ingest \
            -H "X-API-Key: ${INGEST_API_KEY}" -H 'Content-Type: application/json' \
            -d '{"source":"firewall","event_type":"ci-smoke","action":"ALLOW","src_ip":"192.0.2.1"}' \
            | grep -q '"success":true'
          echo "Checking Caddy -> webhook receiver..."
          "${DC[@]}" exec -T backend curl -sk --resolve "localhost:443:${CADDY_IP}" -X POST https://localhost/webhook \
            -H 'Content-Type: application/json' -d '{"smoke":true}' | grep -q '"status":"ok"'
          "${DC[@]}" exec -T backend curl -sf http://webhook-receiver:8000/alerts | grep -q '"smoke":true'
          echo "All smoke checks passed."
      - name: Dump logs and tear down
        if: always()
        run: |
          docker compose -f docker-compose.vm.yml logs 2>&1 || true
          docker compose -f docker-compose.vm.yml down -v 2>&1 || true
      - name: Push images (push events only)
        if: github.event_name == 'push'
        env:
          OWNER: ${{ steps.version.outputs.owner_lower }}
          DEV_TAG: ${{ steps.version.outputs.dev_tag }}
          FULL_SHA: ${{ steps.version.outputs.full_sha }}
        run: |
          set -euo pipefail
          for PKG in backend ingest frontend; do
            docker push "ghcr.io/${OWNER}/logs-manager-${PKG}:${DEV_TAG}"
            docker push "ghcr.io/${OWNER}/logs-manager-${PKG}:${FULL_SHA}"
          done

  deploy-saas:
    needs: [lint-and-test, build-smoke-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: production
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      SAAS_BACKEND_URL: ${{ vars.SAAS_BACKEND_URL || 'https://nayyelin-logs-api.onrender.com' }}
      SAAS_FRONTEND_URL: ${{ vars.SAAS_FRONTEND_URL }}
    steps:
      - uses: actions/checkout@v5
      - name: Trigger Render deploy
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          set -euo pipefail
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" >/dev/null
      - name: Wait for Render to serve the pushed commit
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            SHA=$(curl -fsS --max-time 15 "$SAAS_BACKEND_URL/version" 2>/dev/null \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("git_sha",""))' 2>/dev/null || true)
            if [ "$SHA" = "$GITHUB_SHA" ]; then
              echo "Render is serving $GITHUB_SHA"
              exit 0
            fi
            echo "waiting for Render ($i/90): deployed=${SHA:-none} expected=${GITHUB_SHA}"
            sleep 10
          done
          echo "Render did not serve $GITHUB_SHA within 15 minutes" >&2
          exit 1
      - name: Deploy frontend to Vercel
        if: env.VERCEL_TOKEN != ''
        run: |
          set -euo pipefail
          npm install --global vercel@latest
          cd frontend
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          vercel build --prod --token "$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
      - name: Smoke test SaaS endpoints
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash scripts/smoke_saas.sh "$SAAS_BACKEND_URL" "${SAAS_FRONTEND_URL:-}"
