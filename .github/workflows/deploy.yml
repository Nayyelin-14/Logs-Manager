name: Deploy to VM (promote build)

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: 'Image tag (dev-<ts>-<sha7> or vX.Y.Z)'
        required: true
        type: string
      dry_run:
        description: 'Validate inputs and stop before touching the VM'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-to-vm
  cancel-in-progress: false

jobs:
  plan:
    name: Resolve and validate image reference
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      sha: ${{ steps.resolve.outputs.sha }}
      backend_digest: ${{ steps.resolve.outputs.backend_digest }}
      ingest_digest: ${{ steps.resolve.outputs.ingest_digest }}
      frontend_digest: ${{ steps.resolve.outputs.frontend_digest }}
      dry_run: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate image_ref and resolve tags/digests/revisions
        id: resolve
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          REF="${IMAGE_REF}"
          [[ "${REF}" =~ ^(dev-[0-9]{8}-[0-9]{6}-[0-9a-f]{7}|v[0-9]+\.[0-9]+\.[0-9]+)$ ]] || {
            echo "Invalid image_ref: ${REF}" >&2
            echo "Expected a tag (dev-<ts>-<sha7> or vX.Y.Z)." >&2
            exit 1
          }
          OWNER="${REPO_OWNER,,}"
          SHA=""
          declare -A DIGESTS
          for PKG in backend ingest frontend; do
            IMG="ghcr.io/${OWNER}/logs-manager-${PKG}:${REF}"
            echo "Pulling ${IMG}"
            docker pull -q "${IMG}" >/dev/null
            REV=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${IMG}")
            [ -n "${REV}" ] || { echo "No revision label on ${PKG}" >&2; exit 1; }
            DIG=$(docker inspect --format '{{ index .RepoDigests 0 }}' "${IMG}")
            DIG="${DIG#*@}"
            [[ "${DIG}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Bad digest on ${PKG}: ${DIG}" >&2; exit 1; }
            echo "  ${PKG}: ${REF} -> ${DIG} (rev ${REV})"
            if [ -z "${SHA}" ]; then SHA="${REV}"; fi
            [ "${REV}" = "${SHA}" ] || { echo "Revision mismatch on ${PKG}: ${REV} vs ${SHA}" >&2; exit 1; }
            DIGESTS["${PKG}"]="${DIG}"
          done
          git cat-file -e "${SHA}^{commit}" 2>/dev/null || { echo "Commit ${SHA} not found in repo" >&2; exit 1; }
          BRANCHES=$(git branch -r --contains "${SHA}" || true)
          echo "Branches containing ${SHA}:"
          echo "${BRANCHES}"
          if ! grep -Eq 'origin/(dev|hotfix/.+$)' <<< "${BRANCHES}"; then
            echo "${SHA} is not on origin/dev or origin/hotfix/*" >&2
            exit 1
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "backend_digest=${DIGESTS[backend]}" >> "$GITHUB_OUTPUT"
          echo "ingest_digest=${DIGESTS[ingest]}" >> "$GITHUB_OUTPUT"
          echo "frontend_digest=${DIGESTS[frontend]}" >> "$GITHUB_OUTPUT"
      - name: Determine deploy mode
        id: mode
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          SHA="${{ steps.resolve.outputs.sha }}"
          MAIN_SHA=$(git rev-parse origin/main)
          if [ "${SHA}" = "${MAIN_SHA}" ]; then
            echo "mode=redeploy" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git merge-base --is-ancestor "${MAIN_SHA}" "${SHA}" 2>/dev/null; then
            echo "mode=forward" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git merge-base --is-ancestor "${SHA}" "${MAIN_SHA}" 2>/dev/null; then
            echo "mode=rollback" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "mode=diverged" >> "$GITHUB_OUTPUT"
          exit 1
      - name: Dry run report
        if: ${{ always() && inputs.dry_run }}
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          SHA: ${{ steps.resolve.outputs.sha }}
          BACKEND_DIGEST: ${{ steps.resolve.outputs.backend_digest }}
          INGEST_DIGEST: ${{ steps.resolve.outputs.ingest_digest }}
          FRONTEND_DIGEST: ${{ steps.resolve.outputs.frontend_digest }}
        run: |
          echo "DRY RUN: Mode = ${MODE}"
          echo "DRY RUN: SHA = ${SHA}"
          echo "DRY RUN: Backend digest = ${BACKEND_DIGEST}"
          echo "DRY RUN: Ingest digest  = ${INGEST_DIGEST}"
          echo "DRY RUN: Frontend digest = ${FRONTEND_DIGEST}"
          echo "DRY RUN: Stopping before touching the VM."
      - name: Fail on diverged
        if: ${{ steps.mode.outputs.mode == 'diverged' }}
        run: |
          echo "Diverged: the image's commit is neither an ancestor nor a descendant of main." >&2
          exit 1

  deploy:
    name: Deploy to VM
    needs: plan
    if: ${{ !inputs.dry_run && needs.plan.outputs.mode != 'diverged' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/create-github-app-token@v1
        id: app_token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app_token.outputs.token }}
      - name: Deploy to VM
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          SHA: ${{ needs.plan.outputs.sha }}
          BACKEND_DIGEST: ${{ needs.plan.outputs.backend_digest }}
          INGEST_DIGEST: ${{ needs.plan.outputs.ingest_digest }}
          FRONTEND_DIGEST: ${{ needs.plan.outputs.frontend_digest }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_COMPOSE_DIR: ${{ secrets.VM_COMPOSE_DIR }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VM_SSH_HOST_KEY: ${{ secrets.VM_SSH_HOST_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_MIGRATIONS: ${{ vars.RUN_MIGRATIONS }}
        run: |
          bash .github/scripts/deploy.sh
      - name: Tag prod-current and prod-previous in GHCR
        if: needs.plan.outputs.mode != 'diverged'
        env:
          SHA: ${{ needs.plan.outputs.sha }}
          BACKEND_DIGEST: ${{ needs.plan.outputs.backend_digest }}
          INGEST_DIGEST: ${{ needs.plan.outputs.ingest_digest }}
          FRONTEND_DIGEST: ${{ needs.plan.outputs.frontend_digest }}
          REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          OWNER="${REPO_OWNER,,}"
          for PKG in backend ingest frontend; do
            case "${PKG}" in
              backend)  D="${BACKEND_DIGEST}" ;;
              ingest)   D="${INGEST_DIGEST}" ;;
              frontend) D="${FRONTEND_DIGEST}" ;;
            esac
            BASE="ghcr.io/${OWNER}/logs-manager-${PKG}"
            CUR=$(docker buildx imagetools inspect "${BASE}:prod-current" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
            if [ -n "${CUR}" ] && [ "${CUR}" != "${D}" ]; then
              echo "${PKG}: prod-current -> prod-previous (${CUR})"
              docker buildx imagetools create -t "${BASE}:prod-previous" "${BASE}@${CUR}" >/dev/null
            fi
            echo "${PKG}: prod-current <- ${D}"
            docker buildx imagetools create -t "${BASE}:prod-current" "${BASE}@${D}"
          done
          docker logout ghcr.io
          echo "prod-current/prod-previous tags updated."
      - name: Fast-forward main to deployed SHA (forward only)
        if: needs.plan.outputs.mode == 'forward'
        env:
          SHA: ${{ needs.plan.outputs.sha }}
          APP_TOKEN: ${{ steps.app_token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${REPOSITORY}.git"
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main "${SHA}"; then
            echo "main moved and is no longer an ancestor of ${SHA}. Production is live at ${SHA}; main NOT updated." >&2
            exit 1
          fi
          if ! git push origin "${SHA}:main"; then
            echo "Push to main failed. Production is live at ${SHA}; main NOT updated. No rollback performed." >&2
            exit 1
          fi
          echo "Fast-forwarded main to ${SHA}."
