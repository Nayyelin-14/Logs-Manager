name: Cleanup old GHCR images

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview deletions without actually deleting'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old GHCR image versions
        id: cleanup
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RETENTION_DAYS: '30'
          MAX_DELETIONS: '50'
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && !inputs.dry_run) && 'false' || 'true' }}
          OWNER: ${{ github.repository_owner }}
          PKG_BACKEND: logs-manager-backend
          PKG_INGEST: logs-manager-ingest
          PKG_FRONTEND: logs-manager-frontend
        run: |
          set -euo pipefail
          python3 .github/scripts/cleanup-ghcr.py
