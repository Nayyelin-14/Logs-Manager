name: Debug job conditions

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - name: Print contexts
        run: |
          echo "event=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "ref_name=${{ github.ref_name }}"
          echo "sha=${{ github.sha }}"

  always-true:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != '' }}
    steps:
      - run: echo "always-true ran"

  bare-if:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    steps:
      - run: echo "bare-if ran"

  wrapped-if:
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/dev' }}
    steps:
      - run: echo "wrapped-if ran"

  ref-name-if:
    runs-on: ubuntu-latest
    if: github.ref_name == 'dev'
    steps:
      - run: echo "ref-name-if ran"

  needs-if:
    needs: [base]
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/dev' }}
    steps:
      - run: echo "needs-if ran"

  env-like-deploy:
    needs: [base]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      SAAS_BACKEND_URL: ${{ vars.SAAS_BACKEND_URL || 'https://example.onrender.com' }}
      SAAS_FRONTEND_URL: ${{ vars.SAAS_FRONTEND_URL }}
    steps:
      - name: Print
        run: echo "env-like-deploy ran backend=$SAAS_BACKEND_URL"
