version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: logs
      POSTGRES_PASSWORD: postgres_pass
      POSTGRES_DB: logs_manager
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logs -d logs_manager"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - APP_ENV=development
      - APP_HOST=0.0.0.0
      - APP_PORT=4500
      - DATABASE_URL=postgresql+asyncpg://logs:postgres_pass@postgres:5432/logs_manager?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - ACCESS_TOKEN_SECRET=secret-access-token-dev
      - REFRESH_TOKEN_SECRET=secret-refresh-token-dev
      - COOKIE_SECURE=false
      - COOKIE_SAME_SITE=lax
      - SMTP_ENABLED=false
      - OTP_EMAIL_ENABLED=true
      - ALERT_EMAIL_ENABLED=true
      - INGEST_API_KEY=ingest-key-dev
      - INGEST_API_TENANT=demoA
      - INGEST_API_USERNAME=log-forwarder
      - INGEST_DEFAULT_TENANT=demoA
      - INGEST_BATCH_MAX_EVENTS=1000
      - INGEST_MAX_FILE_BYTES=10485760
      - SYSLOG_ENABLED=true
      - SYSLOG_TENANT=demoA
      - SYSLOG_SOURCE=firewall
      - SYSLOG_USERNAME=syslog
      - SYSLOG_UDP_PORT=5514
      - SYSLOG_TCP_PORT=5514
      - SYSLOG_TIMEZONE=UTC
      - RETENTION_DAYS=7
      - RETENTION_SCHEDULE=0 5 * * *
      - CORS_ORIGINS=["http://localhost:5173", "http://localhost:8080"]
    ports:
      - "4500:4500"
      - "5514:5514/udp"
      - "5514:5514/tcp"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4500/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    command: uvicorn app.main:app --host 0.0.0.0 --port 4500 --reload

  frontend:
    image: logs-manager-frontend:local
    build:
      context: ../frontend/lms
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata: