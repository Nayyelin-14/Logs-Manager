name: lms_vm

services:
  caddy:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE must be set}
    restart: unless-stopped
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "0.0.0.0:${HTTP_PORT:-80}:80"
      - "0.0.0.0:${HTTPS_PORT:-443}:443"
      - "0.0.0.0:${HTTPS_PORT:-443}:443/udp"
    environment:
      - DOMAIN=${DOMAIN:?DOMAIN must be set for SaaS deployment}
      - CADDY_EMAIL=${CADDY_EMAIL:-admin@example.com}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - lms

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set}
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - APP_HOST=0.0.0.0
      - APP_PORT=4500
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set}
      - DATABASE_POOL=queue
      - REDIS_URL=redis://redis:6379
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET:?ACCESS_TOKEN_SECRET must be set}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET:?REFRESH_TOKEN_SECRET must be set}
      - ACCESS_TOKEN_EXPIRE_MINUTES=15
      - REFRESH_TOKEN_EXPIRE_DAYS=30
      - JWT_ALGORITHM=HS256
      - COOKIE_SECURE=true
      - COOKIE_SAME_SITE=lax
      - SMTP_ENABLED=${SMTP_ENABLED:-false}
      - OTP_EMAIL_ENABLED=${OTP_EMAIL_ENABLED:-true}
      - ALERT_EMAIL_ENABLED=${ALERT_EMAIL_ENABLED:-true}
      - INGEST_API_KEY=${INGEST_API_KEY:?INGEST_API_KEY must be set}
      - INGEST_API_USERNAME=log-forwarder
      - INGEST_DEFAULT_TENANT=demoA
      - INGEST_BATCH_MAX_EVENTS=1000
      - INGEST_MAX_FILE_BYTES=10485760
      - SYSLOG_ENABLED=true
      - SYSLOG_TENANT=demoA
      - SYSLOG_SOURCE=firewall
      - SYSLOG_USERNAME=syslog
      - SYSLOG_UDP_PORT=5514
      - SYSLOG_TCP_PORT=5514
      - SYSLOG_TIMEZONE=UTC
      - RETENTION_DAYS=${RETENTION_DAYS:-7}
      - RETENTION_SCHEDULE=0 5 * * *
      - ALERT_SWEEP_INTERVAL=30
      - WORKER_EMBEDDED=false
      - SAAS_MODE=true
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD must be set}
      - SEED_VIEWER_A_PASSWORD=${SEED_VIEWER_A_PASSWORD:?SEED_VIEWER_A_PASSWORD must be set}
      - SEED_VIEWER_B_PASSWORD=${SEED_VIEWER_B_PASSWORD:?SEED_VIEWER_B_PASSWORD must be set}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-http://webhook-receiver:8000/webhook}
      - CORS_ORIGINS=${CORS_ORIGINS:?CORS_ORIGINS must be set}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:?ALLOWED_HOSTS must be set}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4500/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    command: uvicorn app.main:app --host 0.0.0.0 --port 4500
    networks:
      - lms

  ingest:
    image: ${INGEST_IMAGE:?INGEST_IMAGE must be set}
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
      - SYSLOG_ENABLED=true
      - SYSLOG_TENANT=demoA
      - SYSLOG_SOURCE=firewall
      - SYSLOG_USERNAME=syslog
      - SYSLOG_UDP_PORT=5514
      - SYSLOG_TCP_PORT=5514
      - SYSLOG_TIMEZONE=UTC
      - INGEST_DEFAULT_TENANT=demoA
    ports:
      - "0.0.0.0:514:5514/udp"
      - "0.0.0.0:514:5514/tcp"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lms

  worker:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set}
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
      - ALERT_SWEEP_INTERVAL=30
      - RETENTION_DAYS=${RETENTION_DAYS:-7}
    command: python3 -m app.worker
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lms

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-logs}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_DB=${POSTGRES_DB:-logs_manager}
    volumes:
      - pgdata_v18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-logs} -d ${POSTGRES_DB:-logs_manager}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - lms

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 20
    networks:
      - lms

  webhook-receiver:
    image: ${INGEST_IMAGE:?INGEST_IMAGE must be set}
    restart: unless-stopped
    environment:
      - PORT=8000
      - DATABASE_URL=${DATABASE_URL}
    command: ["python3", "ingest/webhook_receiver.py"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - lms

volumes:
  pgdata_v18:
  redisdata:
  caddy_data:
  caddy_config:

networks:
  lms:
    driver: bridge
