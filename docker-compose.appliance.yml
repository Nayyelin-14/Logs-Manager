# Appliance/on-prem override for docker-compose.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.appliance.yml up -d
#
# Provides host port bindings for local development/on-prem use.
# Only Caddy (80/443) and ingest (514) bind to all interfaces (0.0.0.0).
# Database, Redis, Backend, Frontend, Webhook bind to localhost (127.0.0.1) only
# by default, using alternate ports to avoid collisions.
# Set standard ports via env vars like DB_HOST_PORT=5432, REDIS_HOST_PORT=6379, etc.

services:
  caddy:
    ports:
      - "0.0.0.0:${HTTP_PORT:-80}:80"
      - "0.0.0.0:${HTTPS_PORT:-443}:443"

  ingest:
    ports:
      - "0.0.0.0:514:5514/udp"
      - "0.0.0.0:514:5514/tcp"

  db:
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-55432}:5432"

  redis:
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-56379}:6379"

  backend:
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-4500}:4500"

  frontend:
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-8081}:80"

  webhook-receiver:
    ports:
      - "127.0.0.1:${WEBHOOK_PORT:-8000}:8000"