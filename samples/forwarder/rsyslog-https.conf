# rsyslog: forward local syslog to the SaaS HTTPS endpoint.
#
# Requires rsyslog 8.2302+ with omhttp. Drop this file into
# /etc/rsyslog.d/60-logs-manager-https.conf, export the environment variable,
# then `systemctl restart rsyslog`.
#
# The omhttp module posts JSON. This template wraps each syslog message in the
# {"lines": [...]} shape expected by POST /api/ingest/syslog.

module(load="omhttp")

template(name="logsManagerJson" type="string"
         string="{\"lines\":[%msg:::json%]}")

action(
  type="omhttp"
  server="<project>.vercel.app"
  serverport="443"
  usehttps="on"
  restpath="/api/ingest/syslog"
  template="logsManagerJson"
  httpheaders=["X-API-Key: ${INGEST_API_KEY}", "Content-Type: application/json"]
  batch="off"
  retry="on"
  action.resumeRetryCount="-1"
)

# Forward everything. Tighten this selector for production.
*.* action(type="omhttp")
