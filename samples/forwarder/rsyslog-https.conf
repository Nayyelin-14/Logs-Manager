# rsyslog: forward local syslog to the SaaS HTTPS endpoint.
#
# Requires rsyslog 8.2302+ with omhttp. Drop this file into
# /etc/rsyslog.d/60-logs-manager-https.conf, export INGEST_API_KEY in the
# rsyslog service environment, then `systemctl restart rsyslog`.
#
# The omhttp module posts JSON. This template wraps the *full* original
# message (%rawmsg%, including PRI/timestamp/hostname) in the
# {"lines": [...]} shape expected by POST /api/ingest/syslog. Using %msg%
# here would strip the syslog header, lose the device timestamp and force the
# receiver to stamp ingestion time, which breaks retry idempotency.

module(load="omhttp")

template(name="logsManagerJson" type="string"
         string="{\"lines\":[%rawmsg:::json%]}")

# Forward everything. Tighten this selector for production. Keeping the
# action on the selector (instead of a bare action() plus a second `*.*`
# action) avoids forwarding the same message twice.
*.* action(
  name="logsManagerHttps"
  type="omhttp"
  server="<project>.vercel.app"
  serverport="443"
  usehttps="on"
  restpath="/api/ingest/syslog"
  template="logsManagerJson"
  httpcontenttype="application/json"
  # getenv() is the rsyslog RainerScript function; ${VAR} is not expanded by
  # rsyslog in this context. Ensure the variable is exported to the daemon.
  httpheaders=["X-API-Key: " & getenv("INGEST_API_KEY")]
  batch="off"
  retry="on"
  # omhttp retries transport errors, HTTP 429 and 5xx by default.
  action.resumeRetryCount="-1"
  # Bounded, disk-assisted action queue so a restart or long outage does not
  # silently drop messages (256 MiB cap).
  queue.type="LinkedList"
  queue.filename="logsmanager_https"
  queue.size="10000"
  queue.maxDiskSpace="268435488"
  queue.saveOnShutdown="on"
  # If your system CA bundle lives elsewhere, point tls.cacert at it.
  # tls.cacert="/etc/ssl/certs/ca-certificates.crt"
)
