services:
  caddy:
    image: logs-manager-frontend:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "${CADDY_BIND_IP:-127.0.0.1}:${HTTP_PORT:-80}:80"
      - "${CADDY_BIND_IP:-127.0.0.1}:${HTTPS_PORT:-443}:443"
      - "${CADDY_BIND_IP:-127.0.0.1}:${HTTPS_PORT:-443}:443/udp"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - CADDY_EMAIL=${CADDY_EMAIL:-admin@example.com}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - lms

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV:-development}
      - APP_HOST=0.0.0.0
      - APP_PORT=4500
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://logs:postgres_pass@db:5432/logs_manager?sslmode=disable}
      - DATABASE_POOL=${DATABASE_POOL:-queue}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
      - ACCESS_TOKEN_EXPIRE_MINUTES=15
      - REFRESH_TOKEN_EXPIRE_DAYS=30
      - JWT_ALGORITHM=HS256
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - COOKIE_SAME_SITE=${COOKIE_SAME_SITE:-lax}
      - SMTP_ENABLED=${SMTP_ENABLED:-false}
      - OTP_EMAIL_ENABLED=${OTP_EMAIL_ENABLED:-true}
      - ALERT_EMAIL_ENABLED=${ALERT_EMAIL_ENABLED:-true}
      - INGEST_API_KEY=${INGEST_API_KEY}
      - INGEST_API_USERNAME=log-forwarder
      - INGEST_DEFAULT_TENANT=${INGEST_DEFAULT_TENANT:-demoA}
      - INGEST_BATCH_MAX_EVENTS=1000
      - INGEST_MAX_FILE_BYTES=10485760
      # The dedicated `ingest` service owns the native UDP/TCP listeners.
      # The API container must not open a second copy of them.
      - SYSLOG_ENABLED=false
      - SYSLOG_TENANT=${SYSLOG_TENANT:-demoA}
      - SYSLOG_SOURCE=${SYSLOG_SOURCE:-firewall}
      - SYSLOG_USERNAME=syslog
      - SYSLOG_UDP_PORT=5514
      - SYSLOG_TCP_PORT=5514
      - SYSLOG_TIMEZONE=UTC
      - RETENTION_DAYS=${RETENTION_DAYS:-7}
      - RETENTION_SCHEDULE=0 5 * * *
      - ALERT_SWEEP_INTERVAL=30
      - WORKER_EMBEDDED=${WORKER_EMBEDDED:-false}
      - SAAS_MODE=${SAAS_MODE:-false}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-}
      - SEED_VIEWER_A_PASSWORD=${SEED_VIEWER_A_PASSWORD:-}
      - SEED_VIEWER_B_PASSWORD=${SEED_VIEWER_B_PASSWORD:-}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-http://webhook-receiver:8000/webhook}
      - CORS_ORIGINS=${CORS_ORIGINS:-'["http://localhost:5173", "http://localhost:8080"]'}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-'["localhost", "127.0.0.1", "*.logmanager.local"]'}
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-4500}:4500"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4500/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    command: uvicorn app.main:app --host 0.0.0.0 --port 4500
    networks:
      - lms

  ingest:
    build:
      context: .
      dockerfile: ingest/Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
      - SYSLOG_ENABLED=${SYSLOG_ENABLED:-true}
      - SYSLOG_TENANT=${SYSLOG_TENANT:-demoA}
      - SYSLOG_SOURCE=${SYSLOG_SOURCE:-firewall}
      - SYSLOG_USERNAME=syslog
      - SYSLOG_UDP_PORT=5514
      - SYSLOG_TCP_PORT=5514
      - SYSLOG_TIMEZONE=UTC
      - SYSLOG_BIND_IP=${SYSLOG_CONTAINER_BIND_IP:-0.0.0.0}
      - SYSLOG_ALLOWED_CIDRS=${SYSLOG_ALLOWED_CIDRS:-}
      - SYSLOG_DB_RETRY_ATTEMPTS=${SYSLOG_DB_RETRY_ATTEMPTS:-3}
      - SYSLOG_DB_RETRY_BACKOFF_SECS=${SYSLOG_DB_RETRY_BACKOFF_SECS:-0.25}
      - SYSLOG_MAX_INFLIGHT=${SYSLOG_MAX_INFLIGHT:-1000}
      - INGEST_HEALTH_PORT=8090
      - INGEST_DEFAULT_TENANT=${INGEST_DEFAULT_TENANT:-demoA}
    ports:
      - "${SYSLOG_BIND_IP:-0.0.0.0}:${SYSLOG_HOST_PORT:-514}:5514/udp"
      - "${SYSLOG_BIND_IP:-0.0.0.0}:${SYSLOG_HOST_PORT:-514}:5514/tcp"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "ingest/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - lms

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
      - ALERT_SWEEP_INTERVAL=30
      - RETENTION_DAYS=${RETENTION_DAYS:-7}
    command: python3 -m app.worker
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-m", "scripts.healthcheck_db"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - lms

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-logs}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_pass}
      - POSTGRES_DB=${POSTGRES_DB:-logs_manager}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-55432}:5432"
    volumes:
      - pgdata_v18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-logs} -d ${POSTGRES_DB:-logs_manager}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - lms

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-56379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 20
    networks:
      - lms

  webhook-receiver:
    build:
      context: .
      dockerfile: ingest/Dockerfile
    restart: unless-stopped
    environment:
      - PORT=8000
      - DATABASE_URL=${DATABASE_URL}
    ports:
      - "127.0.0.1:${WEBHOOK_PORT:-8008}:8000"
    command: ["python3", "ingest/webhook_receiver.py"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - lms

volumes:
  pgdata_v18:
  redisdata:
  caddy_data:
  caddy_config:

networks:
  lms:
    driver: bridge
